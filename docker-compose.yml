services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: justtodo
      POSTGRES_PASSWORD: justtodo
      POSTGRES_DB: just_to_do2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justtodo -d just_to_do2"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: development
    entrypoint: ["bash", "bin/docker-entrypoint"]
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: justtodo
      DATABASE_PASSWORD: justtodo
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

volumes:
  postgres_data:
